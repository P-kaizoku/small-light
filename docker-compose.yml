services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: smalllight
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d smalllight"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis_cache
    restart: always
    command: redis-server --requirepass myredispassword
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "myredispassword", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: smalllight_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      APP_ENV: development
      DATABASE_URL: postgres://myuser:mysecretpassword@postgres:5432/smalllight?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: myredispassword
      REDIS_DB: "0"
      SHORT_URL_BASE: http://localhost:8080
      DEFAULT_LINK_TTL: 168h
      CLICK_FLUSH_INTERVAL: 30s
      LINK_CLEANUP_INTERVAL: 1h
      JWT_SECRET: dev-jwt-secret-change-me
      JWT_TTL: 24h
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
